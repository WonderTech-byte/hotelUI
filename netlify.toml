[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to the backend (used when VITE_BACKEND_URL is not set)
[[redirects]]
  from = "/api/*"
  to = "https://hotelmanagementsystem-z81c.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
